# Render.com uchun "blueprint" — bitta web servis + bepul PostgreSQL.
# Render'da: New + → "Blueprint" → repozitoriyni ulang → shu fayl avtomatik o'qiladi.
services:
  - type: web
    name: saodat-restoran
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true            # Render avtomatik maxfiy kalit yaratadi
      - key: DATABASE_URL
        fromDatabase:
          name: saodat-db
          property: connectionString
      # Gmail kerak bo'lsa keyin shu yerga qo'shasiz:
      # - key: GMAIL_USER
      #   sync: false
      # - key: GMAIL_APP_PASSWORD
      #   sync: false

databases:
  - name: saodat-db
    plan: free
    databaseName: saodat_db
